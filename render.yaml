# Render Blueprint — one web service serving the API and the built SPA from a single origin.
#
# Deploy:  render.com → New → Blueprint → pick this repo → Apply.
# The service gets a permanent https://<name>.onrender.com address that stays valid for as long
# as the service exists, independent of any laptop.
#
# After the first deploy, read ADMIN_PASSWORD in the Render dashboard (Environment tab) — that is
# the password for admin@exam.local. See README "Deploying a public demo" for the walk-through.

services:
  - type: web
    name: smart-exam-section
    runtime: node
    plan: free
    # devDependencies are needed to build; Render omits them unless asked.
    buildCommand: npm ci --include=dev && npm run build
    # Not `npm start` — that needs cross-env, which is a devDependency.
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Pinned so a future default on the host cannot change the runtime under the app.
      - key: NODE_VERSION
        value: "22"
      # Render terminates TLS one hop in front of the app; without this the real client IP
      # is lost and the per-IP sign-in rate limit becomes a single global bucket. It also lets
      # the Google callback URL be derived as https://… rather than http://….
      - key: TRUST_PROXY
        value: "1"
      # Load the sample examinations, rooms and students on first boot, so the link is worth
      # opening straight away. Set to "false" for a deployment that starts empty.
      - key: ALLOW_DEMO_SEED
        value: "true"
      # No credential panel on the login page: this instance is on the public internet, so the
      # published demo password must not be shown, and (see below) it does not work either.
      - key: DEMO_MODE
        value: "false"
      # Render generates these once and shows them in the dashboard. On every boot the seeded
      # accounts are moved off the published demo password and onto these, so only whoever can
      # read this service's environment can sign in. ADMIN_PASSWORD is for admin@exam.local;
      # STAFF_PASSWORD covers the in-charge and student sample logins.
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: STAFF_PASSWORD
        generateValue: true
      - key: SESSION_TTL_HOURS
        value: "12"
      # Left empty so the blueprint applies without asking anything: the app falls back to the
      # embedded PGlite database and the deploy just works. The free plan has no persistent
      # disk, though, so that database is wiped whenever the service restarts or wakes from
      # idle. To keep data, paste a Postgres connection string here in the dashboard (a free
      # Neon database works) — the schema migrates itself on the next boot.
      - key: DATABASE_URL
        value: ""
      # Only if your provider presents a self-signed certificate chain: set to "insecure".
      # - key: DATABASE_SSL
      #   value: insecure
      # Google Sign-In — optional. Add these two in the dashboard, and register
      # https://<your-service>.onrender.com/api/auth/google/callback as an authorized redirect
      # URI in Google Cloud Console. Nothing else is needed: the callback URL and the post-login
      # origin are derived from the address the browser used.
      # - key: GOOGLE_CLIENT_ID
      #   sync: false
      # - key: GOOGLE_CLIENT_SECRET
      #   sync: false
