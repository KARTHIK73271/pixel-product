<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#031C16" />
    <title>Smart Examination Section</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- paint the canvas before the stylesheet lands, so there is no white flash -->
    <style>
      html {
        background: #031c16;
      }
    </style>
    <!--
      Resolve the theme before first paint. Running this in <head> is the whole
      point: doing it in React means one frame of the wrong theme. Keep the
      storage key and the light/dark decision in step with src/lib/theme.tsx.
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('theme') || 'system';
          var light = pref === 'light' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.dataset.theme = light ? 'light' : 'dark';
          document.documentElement.style.background = light ? '#f7f3ea' : '#031c16';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#F7F3EA' : '#031C16');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
